<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="96" cy="96" r="88" fill="url(#gradient1)" stroke="#ffffff" stroke-width="4"/>

  <!-- Main compose icon inspired design -->
  <g transform="translate(96,96)">
    <!-- Jetpack Compose style blocks -->
    <rect x="-32" y="-32" width="24" height="24" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="-32" y="-4" width="24" height="24" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="-32" y="24" width="24" height="24" rx="4" fill="#ffffff" opacity="0.5"/>

    <rect x="8" y="-20" width="24" height="24" rx="4" fill="url(#gradient2)" opacity="0.9"/>
    <rect x="8" y="8" width="24" height="24" rx="4" fill="url(#gradient2)" opacity="0.7"/>

    <!-- Central connecting element -->
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    <circle cx="0" cy="0" r="4" fill="url(#gradient1)"/>
  </g>

  <!-- Bottom text hint -->
  <text x="96" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1976D2">COMPOSE</text>
</svg>